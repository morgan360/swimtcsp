{% extends 'base/_base.html' %}
{% load static %}
{% block title %}BOIPA | Payment Success{% endblock %}

{% block content %}
<section class="py-12">
  <div
    class="max-w-2xl mx-auto bg-white backdrop-blur-md border border-white/20 rounded-xl shadow-lg p-8 text-blue-900 text-center">

    <h2 class="text-3xl sm:text-4xl font-bold text-green-700 mb-4">✅ Payment Success</h2>

    <p class="text-base sm:text-lg text-blue-800 mb-3">
      Your payment has been successfully processed.
    </p>

    <p class="text-sm sm:text-base mb-1">
      <strong>Order ID:</strong> {{ order_ref }}
    </p>
    <p class="text-sm sm:text-base mb-6">
      <strong>Status:</strong> {{ message }}
    </p>

    <a href="{% url 'home' %}"
      class="inline-block bg-green-600 hover:bg-green-700 text-white font-semibold px-5 py-2 rounded-md transition">
      🏠 Return to Home
    </a>

  </div>
</section>
{% endblock %}
