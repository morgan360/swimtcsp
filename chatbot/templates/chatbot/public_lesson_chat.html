{% extends "base/_base.html" %}
{% block content %}

<div class="box" id="chat-container">
  <h3 class="title is-5">🎓 Ask About Public Lessons</h3>

  <div id="chat-log" style="height: 300px; overflow-y: auto; background: #f5f5f5; padding: 1rem; border-radius: 5px;">
    <div><strong>Bot:</strong> Hi! Ask me about lesson times, term dates, or available classes. 😊</div>
  </div>

  <div class="field has-addons mt-3">
    <div class="control is-expanded">
      <input class="input" type="text" id="chat-input" placeholder="e.g. What lessons are on Monday?">
    </div>
    <div class="control">
      <button class="button is-link" id="chat-send">Send</button>
    </div>
  </div>
</div>

<script>
  const input = document.getElementById("chat-input");
  const log = document.getElementById("chat-log");
  const sendButton = document.getElementById("chat-send");

  function appendMessage(sender, message, isHtml = false) {
    const div = document.createElement("div");
    div.innerHTML = `<strong>${sender}:</strong><div class="content">${message}</div>`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function escapeHtml(unsafe) {
    return unsafe
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  sendButton.addEventListener("click", async () => {
    const userMessage = input.value.trim();
    if (!userMessage) return;

    appendMessage("You", userMessage);
    input.value = "";

    try {
      const response = await fetch("/chatbot/api/chat/public-lessons/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: userMessage }),
      });

      const data = await response.json();
      if (data.reply) {
        appendMessage("Bot", data.reply, true);
      } else {
        appendMessage("Bot", "Sorry, I couldn’t understand that.");
      }
    } catch (err) {
      appendMessage("Bot", "Something went wrong.");
    }
  });
</script>

{% endblock %}
