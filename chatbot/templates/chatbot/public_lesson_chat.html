{% extends "base/_base.html" %}

{% block content %}
    <section class="section">
        <div class="container">
            <div class="box" id="chat-container">
                <h3 class="title is-4 mb-4">💬 Ask About Public Lessons</h3>

                <div id="chat-log" class="content"
                     style="height: 300px; overflow-y: auto; background: #f9f9f9; padding: 1rem; border-radius: 8px;">
                    <div class="notification is-light"><strong>Bot:</strong> Hi! Ask me about available lessons, levels,
                        term dates, or your child’s progression. 😊
                    </div>
                </div>

                <div class="field has-addons mt-4">
                    <div class="control is-expanded">
                        <input class="input" type="text" id="chat-input"
                               placeholder="e.g. Why hasn't my child moved up a level?">
                    </div>
                    <div class="control">
                        <button class="button is-primary" id="chat-send">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("chat-input");
    const log = document.getElementById("chat-log");
    const sendButton = document.getElementById("chat-send");

    input.focus();

    function appendUserMessage(message) {
      const div = document.createElement("div");
      div.className = "notification is-link is-light";
      div.innerHTML = `<strong>You:</strong> ${message}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function appendBotHTMLMessage(html) {
      const div = document.createElement("div");
      div.className = "notification is-info is-light";
      div.innerHTML = `<strong>Bot:</strong> ${html}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function typeBotMessage(message, delay = 15) {
      const div = document.createElement("div");
      div.className = "notification is-info is-light";
      const strong = document.createElement("strong");
      strong.textContent = "Bot: ";
      div.appendChild(strong);
      const span = document.createElement("span");
      div.appendChild(span);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;

      let i = 0;
      function type() {
        if (i < message.length) {
          span.textContent += message.charAt(i);
          log.scrollTop = log.scrollHeight;
          i++;
          setTimeout(type, delay);
        }
      }
      type();
    }

    async function sendMessage() {
      const userMessage = input.value.trim();
      if (!userMessage) return;

      appendUserMessage(userMessage);
      input.value = "";

      try {
        const response = await fetch("{% url 'chatbot:public-lesson-chat' %}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMessage }),
        });

        const data = await response.json();
        if (data.reply) {
          const tempDiv = document.createElement("div");
          tempDiv.innerHTML = data.reply;
          const plainText = tempDiv.textContent || tempDiv.innerText || "";

          if (plainText.length > 200) {
            typeBotMessage(plainText);
          } else {
            appendBotHTMLMessage(data.reply);
          }
        } else {
          typeBotMessage("Sorry, I couldn’t understand that.");
        }
      } catch (err) {
        console.error(err);
        typeBotMessage("Something went wrong.");
      }
    }

    // ✅ Attach event listeners (outside sendMessage!)
    sendButton.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  });
</script>
{% endblock %}
