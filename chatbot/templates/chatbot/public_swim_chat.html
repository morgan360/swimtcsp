{% extends "base/_base.html" %}

{% block content %}
<section class="py-12">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white/20 backdrop-blur-md border border-white/20 rounded-xl shadow-md p-6" id="chat-container">
      <h3 class="text-2xl font-semibold text-white mb-6 flex items-center">💬 Chat with <strong
          class="ml-1">SplashBot</strong></h3>

      <div id="chat-log" class="bg-white rounded-lg shadow-inner h-80 overflow-y-auto p-4 mb-6 space-y-4">
        <div class="bg-blue-100 text-blue-800 rounded-lg p-4">
          <strong>SplashBot:</strong> Hi! I'm <strong>SplashBot</strong> 🐬<br>
          Ask me about swim times, prices, locker access, booking, or anything about your visit to the pool!
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-4">
        <input class=" flex-1 rounded-lg border border-gray-300 p-3 focus:outline-none focus:ring-2
          focus:ring-red-500" type="text" id="chat-input" placeholder="e.g. Do I need a swim hat?">
        <button class="bg-red-700 text-white px-6 py-3 rounded-lg hover:bg-red-800 transition duration-200 flex items-center justify-center"
          id="chat-send">
          <span id="send-text">Send</span>
          <div id="send-spinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white ml-2"></div>
        </button>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("chat-input");
    const log = document.getElementById("chat-log");
    const sendButton = document.getElementById("chat-send");

    input.focus();

    function appendUserMessage(message) {
      const div = document.createElement("div");
      div.className = "bg-blue-200 text-blue-900 rounded-lg p-4";
      div.innerHTML = `<strong>You:</strong> ${message}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function appendBotHTMLMessage(html) {
      const div = document.createElement("div");
      div.className = "bg-blue-100 text-blue-800 rounded-lg p-4";
      div.innerHTML = `<strong>SplashBot:</strong> ${html}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function typeBotMessage(message, delay = 15) {
      const div = document.createElement("div");
      div.className = "bg-blue-100 text-blue-800 rounded-lg p-4";
      const strong = document.createElement("strong");
      strong.textContent = "SplashBot: ";
      div.appendChild(strong);
      const span = document.createElement("span");
      div.appendChild(span);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;

      let i = 0;
      function type() {
        if (i < message.length) {
          span.textContent += message.charAt(i);
          log.scrollTop = log.scrollHeight;
          i++;
          setTimeout(type, delay);
        }
      }
      type();
    }

    async function sendMessage() {
      const userMessage = input.value.trim();
      if (!userMessage) return;

      // Show loading state
      const sendText = document.getElementById("send-text");
      const sendSpinner = document.getElementById("send-spinner");
      sendButton.disabled = true;
      sendText.textContent = "Thinking...";
      sendSpinner.classList.remove("hidden");

      appendUserMessage(userMessage);
      input.value = "";

      try {
        const response = await fetch("{% url 'chatbot:public-swim-chat' %}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMessage }),
        });

        const data = await response.json();
        if (data.reply) {
          if (/<[a-z][\s\S]*>/i.test(data.reply)) {
            appendBotHTMLMessage(data.reply);
          } else {
            typeBotMessage(data.reply);
          }
        } else {
          typeBotMessage("Sorry, I didn't catch that. Can you try rephrasing?");
        }
      } catch (err) {
        console.error(err);
        typeBotMessage("Oops! Something went wrong.");
      } finally {
        // Reset button state
        sendButton.disabled = false;
        sendText.textContent = "Send";
        sendSpinner.classList.add("hidden");
      }
    }

    sendButton.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  });
</script>
{% endblock %}
