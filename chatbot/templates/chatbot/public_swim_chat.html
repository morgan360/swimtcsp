{% extends "base/_base.html" %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="box" id="chat-container">
      <h3 class="title is-4 mb-4">💬 Ask About Public Swims</h3>

      <div id="chat-log" class="content" style="height: 300px; overflow-y: auto; background: #f9f9f9; padding: 1rem; border-radius: 8px;">
        <div class="notification is-light"><strong>Bot:</strong> Hi! Ask me about available public swims. 😊</div>
      </div>

      <div class="field has-addons mt-4">
        <div class="control is-expanded">
          <input class="input" type="text" id="chat-input" placeholder="e.g. Are there swims this weekend?">
        </div>
        <div class="control">
          <button class="button is-primary" id="chat-send">Send</button>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("chat-input");
    const log = document.getElementById("chat-log");
    const sendButton = document.getElementById("chat-send");

    input.focus();

    function appendMessage(sender, message, isBot = false) {
      const div = document.createElement("div");
      div.className = "notification " + (isBot ? "is-info is-light" : "is-link is-light");
      div.innerHTML = `<strong>${sender}:</strong> ${message}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function sendMessage() {
      const userMessage = input.value.trim();
      if (!userMessage) return;

      appendMessage("You", userMessage);
      input.value = "";

      try {
        const response = await fetch("{% url 'chatbot:public-swim-chat' %}", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMessage }),
        });

        const data = await response.json();
        if (data.reply) {
          appendMessage("Bot", data.reply, true);
        } else {
          appendMessage("Bot", "Sorry, I couldn’t understand that.", true);
        }
      } catch (err) {
        appendMessage("Bot", "Something went wrong.", true);
        console.error(err);
      }
    }

    sendButton.addEventListener("click", sendMessage);
    input.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  });
</script>
{% endblock %}
