<form hx-post="{% url 'dashboard:edit_user' user_obj.id %}" 
      hx-target="#editUserFormTarget" 
      hx-swap="innerHTML"
      class="space-y-6">
  {% csrf_token %}
  
  <!-- General Errors -->
  {% if form.non_field_errors %}
    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
      <div class="flex items-start">
        <i class="fas fa-exclamation-circle text-red-500 mr-2 mt-1"></i>
        <div class="text-red-700">
          {% for error in form.non_field_errors %}
            <p class="font-medium">{{ error }}</p>
          {% endfor %}
        </div>
      </div>
    </div>
  {% endif %}

  <!-- Success Message -->
  {% if success %}
    <div class="bg-green-50 border border-green-200 rounded-lg p-4">
      <div class="flex items-center">
        <i class="fas fa-check-circle text-green-500 mr-2"></i>
        <span class="text-green-700 font-medium">User details updated successfully!</span>
      </div>
    </div>
  {% endif %}

  <div class="grid grid-cols-1">
    <!-- Personal Information -->
    <div class="space-y-4">
      <h3 class="text-lg font-semibold text-gray-900 border-b border-gray-200 pb-2">
        <i class="fas fa-user mr-2 text-green-500"></i>Personal Information
      </h3>
      
      <div>
        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
        <input type="text" name="first_name" id="first_name"
               value="{{ user_obj.first_name }}"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
      </div>

      <div>
        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
        <input type="text" name="last_name" id="last_name"
               value="{{ user_obj.last_name }}"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
        <input type="email" name="email" id="email"
               value="{{ user_obj.email }}"
               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
      </div>

      <div class="flex items-center">
        <input type="checkbox" name="is_active" id="is_active"
               {% if user_obj.is_active %}checked{% endif %}
               class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
        <label for="is_active" class="ml-2 block text-sm text-gray-700">
          Account Active
        </label>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-col sm:flex-row gap-4 pt-6 border-t border-gray-200">
    <button type="submit"
            class="flex-1 sm:flex-none inline-flex items-center justify-center px-8 py-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white font-medium rounded-lg hover:from-green-600 hover:to-emerald-600 transition-all duration-200 shadow-lg hover:shadow-xl">
      <i class="fas fa-save mr-2"></i>Save Changes
    </button>
    <button type="button" onclick="closeEditUserModal()"
           class="flex-1 sm:flex-none inline-flex items-center justify-center px-6 py-3 border border-gray-300 text-gray-700 bg-white hover:bg-gray-50 font-medium rounded-lg transition-colors duration-200">
      <i class="fas fa-times mr-2"></i>Cancel
    </button>
  </div>
</form>
