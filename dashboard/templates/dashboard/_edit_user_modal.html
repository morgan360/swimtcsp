<!-- Edit User Modal -->
<div id="editUserModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
    <!-- Header -->
    <div class="bg-gradient-to-r from-green-500 to-emerald-500 px-6 py-4 flex justify-between items-center sticky top-0">
      <h2 class="text-xl font-semibold text-white">Edit User Details</h2>
      <button onclick="closeEditUserModal()" class="text-white hover:text-gray-200 transition-colors">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    
    <!-- Body -->
    <div id="editUserFormTarget" class="p-6">
      <div class="flex items-center justify-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-500 mr-3"></div>
        <span class="text-gray-500">Loading user details...</span>
      </div>
    </div>
  </div>
</div>
