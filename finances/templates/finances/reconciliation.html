{% extends "dashboard/base_dashboard.html" %}
{% load static %}

{% block title %}BOIPA Reconciliation - TCSP{% endblock %}

{% block content %}
<div x-data="reconciliation()" x-init="init()">

  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-4 md:mb-0">
      <i class="fas fa-balance-scale mr-2 text-blue-600"></i>BOIPA Reconciliation
    </h1>
    <div class="flex items-center space-x-2">
      <a :href="csvUrl()" class="inline-flex items-center px-3 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg transition">
        <i class="fas fa-file-csv mr-1.5"></i> Export CSV
      </a>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-lg shadow p-4 mb-6">
    <div class="flex flex-wrap items-end gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Start Date</label>
        <input type="date" x-model="startDate"
               class="block rounded-lg border-gray-300 shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">End Date</label>
        <input type="date" x-model="endDate"
               class="block rounded-lg border-gray-300 shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Order Type</label>
        <select x-model="orderType"
                class="block rounded-lg border-gray-300 shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500">
          <option value="all">All Types</option>
          <option value="lesson">Lessons</option>
          <option value="swim">Swims</option>
          <option value="school">Schools</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Show</label>
        <select x-model="category"
                class="block rounded-lg border-gray-300 shadow-sm text-sm focus:ring-blue-500 focus:border-blue-500">
          <option value="problems">Problems Only</option>
          <option value="all">All Orders</option>
          <option value="matched">Matched</option>
          <option value="mismatched">Amount Mismatch</option>
          <option value="missing_notification">Missing Notification</option>
          <option value="no_txid">No TxId</option>
        </select>
      </div>
      <div>
        <button @click="reload()"
                class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition">
          <i class="fas fa-sync-alt mr-1.5"></i> Apply
        </button>
      </div>
    </div>
  </div>

  <!-- Table + Summary (HTMX target) -->
  <div id="reconciliation-data">
    {% include "finances/partials/reconciliation_table.html" %}
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function reconciliation() {
  return {
    startDate: '{{ start_date }}',
    endDate: '{{ end_date }}',
    orderType: '{{ order_type }}',
    category: '{{ category }}',

    init() {},

    params() {
      return `start_date=${this.startDate}&end_date=${this.endDate}&order_type=${this.orderType}&category=${this.category}`;
    },

    csvUrl() {
      return `{% url 'finances:reconciliation_export_csv' %}?${this.params()}`;
    },

    reload() {
      htmx.ajax('GET', `{% url 'finances:reconciliation_table' %}?${this.params()}`, {
        target: '#reconciliation-data',
        swap: 'innerHTML'
      });
    }
  };
}
</script>
{% endblock %}
