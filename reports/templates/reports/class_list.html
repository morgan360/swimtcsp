{% extends "base/_base.html" %}
{% load static %}

{% block content %}
<section class="py-8">
  <div class="max-w-4xl mx-auto bg-white/50 rounded-lg shadow-lg p-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Print Class Lists</h2>

    <form method="get" action="{% url 'reports:class_print' %}" class="space-y-6">

      <!-- Term -->
      <div>
        <label for="id_term" class="block text-sm font-medium text-gray-700 mb-1">Term</label>
        <select name="term" id="id_term" class="w-full border border-gray-300 rounded-md shadow-sm">
          <option value="current">Current Term</option>
          <option value="next">Next Term</option>
        </select>
      </div>

      <!-- Category -->
      <div>
        <label for="id_category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select name="category" id="id_category"
                hx-get="{% url 'reports:update-days' %}"
                hx-trigger="change"
                hx-target="#id_day"
                class="w-full border border-gray-300 rounded-md shadow-sm">
          <option value="">Select a Category</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Day -->
      <div>
        <label for="id_day" class="block text-sm font-medium text-gray-700 mb-1">Day</label>
        <select name="day" id="id_day"
                hx-get="{% url 'reports:update-lessons' %}"
                hx-trigger="change"
                hx-include="#id_category"
                hx-target="#id_lesson"
                class="w-full border border-gray-300 rounded-md shadow-sm">
          {% include 'reports/partials/day_options.html' %}
        </select>
      </div>

      <!-- Lesson -->
      <div>
        <label for="id_lesson" class="block text-sm font-medium text-gray-700 mb-1">Lesson</label>
        <select name="lesson" id="id_lesson" class="w-full border border-gray-300 rounded-md shadow-sm">
          {% include 'reports/partials/lesson_options.html' %}
        </select>
      </div>

      <!-- Submit -->
      <div>
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded shadow">
          🖨️ Print Class List
        </button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
