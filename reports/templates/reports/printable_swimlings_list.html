{% extends "base/_base.html" %}

{% block content %}
<script>
    function printDiv(divName) {
        var printContents = document.getElementById(divName).innerHTML;
        var printWindow = window.open('', '_blank');

        printWindow.document.write('<html><head><title>Print</title>');
        printWindow.document.write('<style>');
        printWindow.document.write('body { font-size: 12pt; margin-top: 20px; font-family: sans-serif; } ');
        printWindow.document.write('h2 { text-align: center; font-size: 20pt; }');
        printWindow.document.write('table { width: 80%; margin: 0 auto; border-collapse: collapse; } ');
        printWindow.document.write('th, td { border: 1px solid #ccc; padding: 8px; text-align: left; } ');
        printWindow.document.write('thead { background-color: #f5f5f5; }');
        printWindow.document.write('</style></head><body>');
        printWindow.document.write(printContents);
        printWindow.document.write('</body></html>');

        printWindow.document.close();
        setTimeout(function () {
            printWindow.print();
            printWindow.close();
        }, 250);
    }
</script>

<section class="py-8">
    <div class="max-w-4xl mx-auto bg-white/50 rounded-lg shadow-lg p-6">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-700">{{ product }}</h1>
            <p class="text-lg text-gray-600">Enrolled Swimlings List</p>
        </div>

        <p class="text-right font-semibold text-gray-700 mb-4">
            Total Swimlings: {{ swimlings|length }}
        </p>

        <div id="printableArea">
            <div class="overflow-x-auto">
                <table class="min-w-full border border-gray-300 divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-4 py-2 text-left font-semibold text-gray-700 border">Swimling Name</th>
                            <th class="px-4 py-2 text-left font-semibold text-gray-700 border">Guardian</th>
                            <th class="px-4 py-2 text-left font-semibold text-gray-700 border">Notes</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-100">
                        {% for swimling in swimlings %}
                            <tr>
                                <td class="px-4 py-2 border">{{ swimling }}</td>
                                <td class="px-4 py-2 border">{{ swimling.guardian }}</td>
                                <td class="px-4 py-2 border">{{ swimling.notes }}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-center mt-6">
            <button class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded shadow transition"
                    onclick="printDiv('printableArea')">
                🖨️ Print
            </button>
        </div>
    </div>
</section>
{% endblock %}
