{% extends "base/_base.html" %}
{% load static %}

{% block title %}
  School Lessons
{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <!-- 🔽 Filter Form -->
    <div class="box has-shadow">
      <form method="get"
            action="{% url 'schools:school_list' %}"
            hx-get="{% url 'schools:school_list' %}"
            hx-target="#lesson-list"
            hx-swap="innerHTML"
            hx-trigger="change from:select">
        <div class="field is-horizontal is-grouped is-grouped-multiline is-flex is-justify-content-center">
          {{ form.as_table }}
        </div>
      </form>
    </div>

    <!-- 📋 Lesson List Content -->
    <div id="lesson-list">
      {% include "schools/partials/_lesson_list.html" %}
    </div>
  </div>
</section>
{% endblock %}
