{% extends "base/_base.html" %}
{% load static %}

{% block title %}Your Shopping Cart{% endblock %}

{% block content %}
<section class="py-12 px-4 sm:px-6 lg:px-8 text-white">
  <div class="max-w-3xl mx-auto px-4">
    <div class="bg-white/50 rounded-2xl shadow-md p-6 space-y-6">
      <h2 class="text-2xl font-bold text-white">Review Order</h2>

      <div class="text-gray-800 text-base space-y-2">
        <p><strong class="text-blue-900">Swimling:</strong> {{ swimling }}</p>
        <p><strong class="text-blue-900">Lesson:</strong> {{ lesson.name }}</p>
        <p><strong class="text-blue-900">Price:</strong> €{{ lesson.price }}</p>
      </div>

      <form method="POST" action="{% url 'shopping_cart:confirm_rebooking' swimling.id lesson.id %}" class="space-y-4">
        {% csrf_token %}
        <div>
          <button type="submit"
                  class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-3 px-4 rounded flex items-center justify-center gap-2 transition">
            <i class="fas fa-check mr-2"></i>
            Confirm and Pay
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
