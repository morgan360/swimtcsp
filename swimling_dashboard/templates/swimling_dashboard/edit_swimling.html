{% extends "base/_base.html" %}
{% load static %}

{% block title %}Edit Swimling{% endblock %}

{% block content %}
<section class="py-10">
  <div class="max-w-3xl mx-auto px-4">

    <!-- 🧭 Page Title -->
    <h2 class="text-3xl font-bold text-green-700 mb-6">✏️ Edit Swimling</h2>

    <!-- 🧾 Form Card -->
    <div class="bg-green-50 rounded-xl shadow p-6">
      <form method="POST">
        {% csrf_token %}

        <!-- 🧒 First Name -->
        <div class="mb-5">
          <label class="block text-gray-800 font-semibold mb-2">First Name</label>
          <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"
                 type="text" name="first_name" value="{{ form.first_name.value }}" required>
        </div>

        <!-- 👤 Last Name -->
        <div class="mb-5">
          <label class="block text-gray-800 font-semibold mb-2">Last Name</label>
          <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"
                 type="text" name="last_name" value="{{ form.last_name.value }}" required>
        </div>

        <!-- 🎂 Date of Birth -->
        <div class="mb-5">
          <label class="block text-gray-800 font-semibold mb-2">Date of Birth</label>
          <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"
                 type="date" name="dob" value="{{ form.dob.value|date:'Y-m-d' }}">
        </div>

        <!-- 🏫 School Role Number -->
        <div class="mb-5">
          <label class="block text-gray-800 font-semibold mb-2">School Role Number</label>
          <input class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"
                 type="text" name="sco_role_num" value="{{ form.sco_role_num.value|default_if_none:'' }}">
        </div>

        <!-- 📝 Notes -->
        <div class="mb-6">
          <label class="block text-gray-800 font-semibold mb-2">Additional Notes</label>
          <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 bg-white"
                    name="notes" placeholder="Optional notes...">{{ form.notes.value }}</textarea>
        </div>

        <!-- 📍 Buttons -->
        <div class="flex items-center gap-4">
          <button type="submit"
                  class="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-lg transition">
            💾 Save Changes
          </button>
          <a href="{% url 'swimling_dashboard:guardian_dashboard' %}"
             class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium px-5 py-2 rounded-lg transition">
            Cancel
          </a>
        </div>
      </form>
    </div>

  </div>
</section>
{% endblock %}
