{% load custom_filters %}
<form 
method="POST" 
hx-post="{% url 'swimling_dashboard:edit-swimling' id=swimling.id %}" hx-target="#editSwimlingFormTarget" 
class="bg-white/50 p-6 rounded-lg shadow-lg">
  {% csrf_token %}

  <!-- 🧒 First Name -->
  <div class="mb-5">
    <label class="block text-red-800 font-semibold mb-2">First Name</label>
    <input
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      type="text" name="first_name" value="{{ form.first_name.value }}" required>
  </div>

  <!-- 👤 Last Name -->
  <div class="mb-5">
    <label class="block text-red-800 font-semibold mb-2">Last Name</label>
    <input
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      type="text" name="last_name" value="{{ form.last_name.value }}" required>
  </div>

  <!-- 🎂 Date of Birth -->
  <div class="mb-5">
    <label class="block text-red-800 font-semibold mb-2">Date of Birth</label>
    <input
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      type="date" name="dob" value="{{ form.dob.value|date:'Y-m-d' }}">
  </div>

  <!-- 🏫 School Role Number -->
  <div class="mb-5">
    <label class="block text-red-800 font-semibold mb-2">School Role Number</label>
    <input
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      type="text" name="sco_role_num" value="{{ form.sco_role_num.value|default_if_none:'' }}">
  </div>

  <!-- 🩺 Medical information -->
  <div class="mb-5">
    <label class="block text-red-800 font-semibold mb-2">Medical information</label>
    <textarea
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      name="medical_info"
      placeholder="e.g. asthma, epilepsy, allergies, hearing aid. Leave blank if there is nothing.">{{ form.medical_info.value|default_if_none:'' }}</textarea>
    <p class="text-sm text-gray-600 mt-1">This is printed on the class teacher's attendance sheet.</p>
  </div>

  <!-- 📝 Notes -->
  <div class="mb-6">
    <label class="block text-red-800 font-semibold mb-2">Other notes</label>
    <textarea
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
      name="notes" placeholder="Anything else you would like us to know.">{{ form.notes.value|default_if_none:'' }}</textarea>
    <p class="text-sm text-gray-600 mt-1">Not shown to teachers.</p>
  </div>

  <!-- 📍 Buttons -->
  <div class="flex items-center gap-4">
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-5 py-2 rounded-lg transition">
      <i class="fa-solid fa-floppy-disk mr-2"></i>
      Save Changes
    </button>
    <button type="button" onclick="closeEditSwimlingModal()"
      class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium px-5 py-2 rounded-lg transition">
      Cancel
    </button>
  </div>
</form>
