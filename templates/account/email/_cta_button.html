{% comment %}
Solid colours, set inline and on the table cell: Gmail and Outlook drop CSS
gradients, which left white text on a white background. Pass url and label.
{% endcomment %}
<table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" style="margin: 30px auto 8px;">
  <tr>
    <td align="center" bgcolor="#2563eb" style="background-color:#2563eb; border-radius:8px;">
      <a href="{{ url }}" style="display:inline-block; padding:12px 24px; background-color:#2563eb; color:#ffffff; font-weight:bold; text-decoration:none; border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
