{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block content %}

<div class="flex justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white/40 backdrop-blur-md border border-white/20 rounded-xl p-6 shadow-lg">
        <h2 class="text-2xl font-bold mb-4 text-center text-white">{% trans "Change Password" %}</h2>

        <form method="POST" action="{% url 'account_change_password' %}" class="bg-white/50 p-6 rounded-lg shadow">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" name="action" class="mt-4 bg-red-800 text-white py-2 px-4 rounded-lg hover:bg-red-900 transition border border-white">{% trans "Change Password" %}</button>
            <a href="{% url 'account_reset_password' %}" class="text-blue-900 hover:underline">{% trans "Forgot Password?" %}</a>
        </form>
    </div>
</div>
{% endblock %}
