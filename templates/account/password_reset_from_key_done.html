{% extends "account/base.html" %}

{% load i18n %}
{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
<div class="flex justify-center px-4 py-10">
    <div class="w-full max-w-md bg-white/40 backdrop-blur-md border border-white/20 rounded-xl p-6 shadow-lg">
        <h2 class="text-2xl font-bold mb-5 text-center text-white">{% trans "Change Password" %}</h2>
        <p class="mb-2 text-md text-white font-medium text-center">{% trans 'Your password is now changed.' %}</p>
        <div class="flex justify-center">
            <a href="{% url 'account_login' %}" class="bg-red-700 text-white text-lg py-2 px-4 rounded-lg mt-2
            font-semibold hover:bg-red-800 transition border border-white/60">
                {% trans 'Log in' %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
