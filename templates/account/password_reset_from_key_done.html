{% extends "base/_base.html" %}

{% load i18n %}
{% load account %}
{% block head_title %}{% trans "Password Reset" %}{% endblock %}

{% block content %}
<div class="relative min-h-screen flex items-center justify-center p-6">
    <div class="bg-white/30 backdrop-blur-md border border-white/40 rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
        <div class="flex items-center justify-center mb-6">
            <i class="fas fa-key text-white text-3xl mr-3"></i>
            <h2 class="text-white text-3xl font-bold">{% trans "Password Reset" %}</h2>
        </div>
        <p class="text-white">{% trans 'Your password is now changed.' %}</p>
        <a href="{% url 'account_login' %}" class="mt-6 w-full bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 text-white font-semibold py-3 rounded-lg transition inline-block">
            {% trans 'Log in' %}
        </a>
    </div>
</div>
{% endblock %}
