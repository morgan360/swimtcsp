{% extends "admin/base.html" %}
{% load static %}
{% block extrastyle %}
  {{ block.super }}
  {% if custom_css %}
    <link rel="stylesheet" href="{% static custom_css %}">
  {% endif %}
{% endblock %}
{% block branding %}
  <a href="/" style="display: flex; align-items: center; padding-left: 1rem; text-decoration: none;">
    <img src="{% static 'img/logo.png' %}" alt="TCSP Logo" style="height: 60px; margin-right: 1rem;" />
    <span style="color: white; font-size: 1.5rem; font-weight: 600;">TCSP Administration</span>
  </a>
{% endblock %}
