{# Styles for _dial.html, shared by the Live Dashboard and the Operations strip. #}
<style>
  #content { min-width: 0; }  /* a flex item: let the grids below shrink to the screen */
  .dash-card { min-width: 0; background: var(--body-bg); border: 1px solid var(--hairline-color); border-radius: 10px; padding: 1rem; }
  .dash-card h2 { font-size: 0.95rem; margin: 0 0 0.5rem; color: var(--body-fg); background: none; padding: 0; text-transform: none; letter-spacing: 0; }
  .dash-hint, .dash-caption { color: var(--body-quiet-color); font-size: 0.8rem; }
  .is-muted { color: var(--body-quiet-color) !important; }

  .reg-wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 13rem); gap: 1rem; margin-bottom: 1rem; }
  @media (max-width: 767px) { .reg-wrap { grid-template-columns: minmax(0, 1fr); } }
  .reg-week + .reg-week { margin-top: 1rem; }
  .reg-week h3 { margin: 0 0 0.4rem; font-size: 0.85rem; color: var(--body-fg); background: none; padding: 0; text-transform: none; letter-spacing: 0; }
  .reg-days { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.25rem; }
  .reg-day { flex: 1 0 4.25rem; min-width: 0; }
  .reg-day-name { display: block; margin-bottom: 0.25rem; color: var(--body-quiet-color); font-size: 0.75rem; }
  .reg-boxes { display: flex; flex-wrap: wrap; gap: 3px; }
  .reg-box { display: block; box-sizing: border-box; width: 14px; height: 14px; border: 1.5px solid #64748b; border-radius: 3px; }
  .reg-box.is-taken { background: #16a34a; border-color: #16a34a; }
  .reg-box.is-missed { background: transparent; }
  .reg-box.is-later { background: #e2e8f0; border: 1.5px dashed #64748b; }
  a.reg-box:hover, a.reg-box:focus { outline: 2px solid #2563eb; outline-offset: 1px; }
  .reg-closed { color: var(--body-quiet-color); font-size: 0.75rem; }
  .reg-key { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; color: var(--body-quiet-color); font-size: 0.75rem; }
  .reg-key span { display: inline-flex; align-items: center; gap: 0.3rem; }

  .dash-dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(210px, 100%), 1fr)); gap: 1rem; margin-bottom: 1rem; }
  .dash-dial { text-align: center; }
  .dash-dial svg { width: 100%; max-width: 240px; display: block; margin: 0 auto; overflow: visible; }
  .dash-dial .zone { fill: none; stroke-width: 4; }
  .dash-dial .zone-low { stroke: #f59e0b; }
  .dash-dial .zone-mid { stroke: #2563eb; }
  .dash-dial .zone-high { stroke: #16a34a; }
  .dash-dial .track, .dash-dial .fill { fill: none; stroke-width: 14; stroke-linecap: round; }
  .dash-dial .track { stroke: var(--darkened-bg); }
  .dash-dial .fill { animation: dash-arc 1.2s ease-out; }
  .dash-dial.is-low .fill { stroke: #f59e0b; }
  .dash-dial.is-mid .fill { stroke: #2563eb; }
  .dash-dial.is-high .fill { stroke: #16a34a; }
  .dash-dial.is-none .fill { stroke: none; }
  .dash-dial .needle { transform-origin: 100px 100px; transform: rotate(var(--angle)); animation: dash-needle 1.2s cubic-bezier(.3, 1.4, .5, 1); }
  .dash-dial .needle line { stroke: var(--body-fg); stroke-width: 3.5; stroke-linecap: round; }
  .dash-dial.is-none .needle { opacity: 0.25; }
  .dash-dial .target { transform-origin: 100px 100px; transform: rotate(var(--angle)); }
  .dash-dial .target line { stroke: #dc2626; stroke-width: 3; stroke-linecap: round; }
  .dash-target-key { display: inline-block; width: 3px; height: 0.8em; background: #dc2626; border-radius: 2px; margin-right: 0.35em; vertical-align: -0.05em; }
  .dash-dial .hub { fill: var(--body-fg); }
  .dash-dial .ends { fill: var(--body-quiet-color); font-size: 11px; }
  .dash-big { font-size: 2rem; font-weight: 700; color: var(--body-fg); font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 0.25rem; }
  @keyframes dash-needle { from { transform: rotate(-90deg); } }
  @keyframes dash-arc { from { stroke-dasharray: 0 283; } }
  @media (prefers-reduced-motion: reduce) { .dash-dial .needle, .dash-dial .fill { animation: none; } }
</style>
