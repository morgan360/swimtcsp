{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<style>
  /* Scrollable table wrapper with always-visible scrollbar */
  #changelist .results {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-height: 80vh;
    overflow-y: auto;
  }

  /* Make scrollbar always visible (not just on hover) */
  #changelist .results::-webkit-scrollbar {
    height: 14px;
    width: 14px;
  }
  #changelist .results::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
  }
  #changelist .results::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 4px;
    border: 2px solid #f1f1f1;
  }
  #changelist .results::-webkit-scrollbar-thumb:hover {
    background: #555;
  }

  /* Firefox - always show scrollbar */
  #changelist .results {
    scrollbar-width: auto;
    scrollbar-color: #888 #f1f1f1;
  }

  /* Sticky header so column names stay visible when scrolling vertically */
  #changelist table#result_list thead th {
    position: sticky;
    top: 0;
    background: var(--header-bg, #417690);
    color: var(--header-color, #fff);
    z-index: 1;
  }

  /* Make table cells not wrap */
  #changelist table#result_list td,
  #changelist table#result_list th {
    white-space: nowrap;
  }

  /* Tooltip styling for truncated text */
  #changelist table#result_list td span[title] {
    cursor: help;
    border-bottom: 1px dotted #999;
  }
</style>
{% endblock %}
