{% load i18n %}
<script type="text/javascript">var go_from_select = function(opt) { window.location = window.location.pathname + opt };</script>
<h3>{% blocktrans with title as filter_title %} By {{ filter_title }} {% endblocktrans %}</h3>
<ul class="admin-filter-{{ title|cut:' ' }}">
{% if choices|slice:"4:" %}
    <li>
    <input type="text" class="filter-search-input" placeholder="Search..."
        style="width: 95%; margin: 2% 2% 4px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px;"
        oninput="filterDropdownOptions(this)">
    <select class="form-control" style="width: 95%;margin-left: 2%;"
        onchange="go_from_select(this.options[this.selectedIndex].value)">
    {% for choice in choices %}
        <option{% if choice.selected %} selected="selected"{% endif %}
         value="{{ choice.query_string|iriencode }}">{{ choice.display }}</option>
    {% endfor %}
    </select>
    </li>
{% else %}

    {% for choice in choices %}
            <li{% if choice.selected %} class="selected"{% endif %}>
            <a href="{{ choice.query_string|iriencode }}">{{ choice.display }}</a></li>
    {% endfor %}

{% endif %}
</ul>
<script type="text/javascript">
function filterDropdownOptions(input) {
    var filter = input.value.toLowerCase();
    var select = input.parentElement.querySelector('select');
    var options = select.options;
    for (var i = 0; i < options.length; i++) {
        var text = options[i].text.toLowerCase();
        // Always show "All" option (first item)
        if (i === 0) {
            options[i].style.display = '';
        } else {
            options[i].style.display = text.indexOf(filter) > -1 ? '' : 'none';
        }
    }
}
</script>
