{% extends "base/_base.html" %}
{% load static %}

{% block title %}Timetable{% endblock %}

{% block content %}
    <section class="py-6">
        <div class="bg-white/40 backdrop-blur-md border border-white/20 rounded-xl shadow-md p-10 w-full max-w-7xl mx-auto px-4" x-data="timetableApp()" x-init="fetchEvents()">
            <h1 class="text-3xl font-bold mb-6 text-white text-center">Weekly Timetable</h1>

            <!-- 🗂 Tabs -->
            <div class="flex justify-center mb-6 text-lg">
                <ul class="flex space-x-4">
                    <li>
                        <a href="#" 
                           @click.prevent="switchTab('lessons')" 
                           :class="currentTab === 'lessons' ? 'mb-2 text-white px-4 font-semibold py-2 rounded-md bg-blue-900' : 'bg-white shadow hover:bg-blue-600 hover:text-white  rounded-md px-4 py-2'">
                            Lessons
                        </a>
                    </li>
                    <li>
                        <a href="#"
                           @click.prevent="switchTab('swims')" 
                           :class="currentTab === 'swims' ? 'mb-2 text-white px-4 font-semibold py-2 rounded-md bg-blue-900' : 'bg-white hover:bg-blue-600 hover:text-white  rounded-md px-4 py-2'">
                            Public Swims
                        </a>
                    </li>
                </ul>
            </div>

            <!-- 📅 Weekly Grid -->
            <div class="grid grid-cols-7 gap-4 bg-white/50 p-6 rounded-lg shadow-lg">
                <template x-for="(day, index) in 7" :key="index">
                    <div
                        class="flex flex-col px-2 text-blue-900"
                        :class="{ 'bg-white/60 border border-red-500 rounded-md pt-2 pb-2': dateFor(index) === today  }"
                    >
                        <!-- Day header -->
                        <div class="text-center font-semibold text-md font-semibold mb-3 h-10 flex items-center justify-center"
                             x-text="dayLabel(index)">
                        </div>

                        <!-- Time block grouping -->
                        <template
                                x-for="[timeBlock, events] of Object.entries(groupedEventsForDay(index)).sort((a, b) => a[0].localeCompare(b[0]))"
                                :key="timeBlock">
                            <div class="mb-2 text-md">
                                <p class="text-gray-700 mb-1">
                                    🕘 <strong x-text="formatTimeRange(timeBlock)"></strong>
                                </p>
                                <ul class="ml-3 list-none pl-4">
                                    <template x-for="event in events" :key="event.title + event.start">
                                        <li>
                                            <span x-text="eventIcon(event.type, event.category) + ' ' + cleanTitle(event.title)"></span>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- ✅ External JS -->
    <script src="{% static 'js/timetable.js' %}"></script>
{% endblock %}
