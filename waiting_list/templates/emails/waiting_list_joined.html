<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>You've Been Added to the Waiting List</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; background-color: #f7f7f7; padding: 20px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: auto; background-color: #ffffff; border-radius: 8px; padding: 20px;">
        <tr>
            <td>
                <h2 style="color: #2c3e50;">Hi {{ guardian.first_name }},</h2>
                <p>
                    Your swimling <strong>{{ swimling.first_name }}</strong> has been added to the waiting list for:
                </p>
                <p style="font-size: 18px; font-weight: bold; margin-top: 10px;">
                    "{{ product.name }}"
                </p>
                <p>
                    We'll notify you by email as soon as a spot becomes available.
                </p>
                <p style="margin-top: 30px;">
                    Thank you,<br>
                    <strong>The Swim School Team</strong>
                </p>
            </td>
        </tr>
    </table>
</body>
</html>
