{% extends 'base/_base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-12 p-6 bg-white shadow-md rounded">
  <h2 class="text-xl font-bold mb-4 text-center">Join the Waiting List</h2>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="w-full bg-blue-600 text-white px-4 py-2 rounded">
      Continue
    </button>
  </form>
</div>
{% endblock %}
